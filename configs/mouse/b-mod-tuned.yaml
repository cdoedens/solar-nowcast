model:
    name: b-mod-tuned
    forecast_lead: 3
    parameters:
        random_state: 42
        n_estimators: 2000
        early_stopping_rounds: 50
        learning_rate: 0.035
        eval_metric: rmse
        max_depth: 4
        min_child_weight: 3
        subsample: 0.774
        'colsample_bytree': 0.714620690738731
        gamma: 0.00888
        reg_alpha: 0.03242
        reg_lambda: 0.376
data:
    predictors:
        - hus500
        - ta500
        - KI
        - RH24mean
        - TCD
        - ATP
        - psl
        - delta_huss
        - delta_hus850
        - delta_hus700
        - delta_hus500
        - delta_tas
        - delta_ta850
        - delta_ta700
        - delta_ta500
        - delta_KI
        - delta_RH24mean
        - delta_TCD
        - delta_psl
    target: csi
